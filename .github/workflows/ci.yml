name: CometGateway CI / Evaluation Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-eval-gate:
    name: Backend Privacy, Fallback & Golden Benchmark Gates
    runs-on: ubuntu-latest
    env:
      MOCK_MODE: "true"
      OPENAI_API_KEY: "mock-key"
      ANTHROPIC_API_KEY: "mock-key"
      GEMINI_API_KEY: "mock-key"
      DATABASE_URL: "sqlite+aiosqlite:///./telemetry.db"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Evaluation Suite & Privacy Gates
        run: |
          pytest backend/tests -v -s

  frontend-build-gate:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Type-Check & Vite Build
        working-directory: frontend
        run: npm run build
